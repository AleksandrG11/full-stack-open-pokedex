name: Course CI pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint JavaScript
        run: npm run eslint
      - name: Run Jest unit tests
        run: npm test -- --runInBand
        env:
          CI: 'true'
      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
      - name: Publish tested bundle (main push only; not deployment)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '#skip') }}
        uses: actions/upload-artifact@v4
        with:
          name: pokedex-${{ github.sha }}
          path: dist/

  deploy_pages:
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '#skip') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build GitHub Pages bundle
        run: npm run build:pages
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Add SPA fallback and static health manifest
        run: |
          cp dist/index.html dist/404.html
          printf '{"status":"ok","sha":"%s"}\n' "$GITHUB_SHA" > dist/health.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
